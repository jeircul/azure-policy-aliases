name: Update Aliases

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

env:
  GIT_USER_EMAIL: "github-actions[bot]@users.noreply.github.com"
  GIT_USER_NAME: "Azure Policy Bot"

jobs:
  update:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The main-protection ruleset lets only this deploy key push to main without a PR
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - name: Login
        uses: ./.github/actions/az-login
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
      - name: Get Updated Aliases
        shell: pwsh
        run: ./src/Get-ResourceAliases.ps1
      - name: Guard against mass deletion
        run: |
          before=$(git ls-tree -r --name-only HEAD -- aliases | wc -l)
          after=$(find aliases -type f | wc -l)
          echo "Alias files: before=$before after=$after"
          if [ "$before" -gt 0 ] && [ $((after * 10)) -lt $((before * 9)) ]; then
            echo "::error::Alias file count dropped by more than 10% ($before -> $after)"
            exit 1
          fi
      - name: Auto commit changes
        run: |
          now=$(date +'%a %d %b %Y')
          git config --local user.email "$GIT_USER_EMAIL"
          git config --local user.name "$GIT_USER_NAME"
          git add --all
          if [ -n "$(git status --porcelain)" ]; then
            git commit -a -m "chore: update Azure policy aliases ($now)"
            git push
          fi
